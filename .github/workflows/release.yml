name: Publish SPF Package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Attach SPF ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            global_utils.zip \
            --clobber
